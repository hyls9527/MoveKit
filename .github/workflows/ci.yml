name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout=5m

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Lint frontend (ESLint)
        run: cd frontend && npm run lint

      - name: Check TypeScript types
        run: cd frontend && npm run lint:ts

      - name: Run frontend tests
        run: cd frontend && npm run test

  vuln:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - name: Run govulncheck dependency scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        shell: pwsh

  test:
    needs: vuln
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Verify GCC available for race detector
        run: gcc --version

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
        shell: bash

      - name: Run Go tests with race detection and coverage
        run: gotestsum --junitfile test-results.xml -- -race -coverprofile=coverage.out -covermode=atomic ./...
        shell: bash

      - name: Print coverage summary
        run: go tool cover -func=coverage.out
        shell: bash

      - name: Enforce coverage thresholds
        shell: pwsh
        run: |
          $lines = Get-Content coverage.out | Where-Object { $_ -notmatch '^mode:' }
          $totalStmts = 0; $coveredStmts = 0
          $mainStmts = 0; $mainCov = 0
          $bizStmts = 0; $bizCov = 0
          foreach ($l in $lines) {
            $parts = $l -split ' '
            $s = [int]$parts[1]; $c = [int]$parts[2]
            $totalStmts += $s
            if ($c -gt 0) { $coveredStmts += $s }
            $isMain = $l -match '^github\.com/hyls9527/MoveKit/(app|main|app_types)\.go:'
            $isGenerated = $l -match 'mocks/|flatted'
            if ($isMain) { $mainStmts += $s; if ($c -gt 0) { $mainCov += $s } }
            if (-not $isGenerated) { $bizStmts += $s; if ($c -gt 0) { $bizCov += $s } }
          }
          $totalPct = 100.0 * $coveredStmts / $totalStmts
          $mainPct = 100.0 * $mainCov / $mainStmts
          $bizPct = 100.0 * $bizCov / $bizStmts
          Write-Host ("coverage total={0:N1}% main={1:N1}% business={2:N1}%" -f $totalPct, $mainPct, $bizPct)
          if ($mainPct -lt 55.0 -or $bizPct -lt 55.0) {
            Write-Host "::error::Coverage below threshold (main >= 55%, business >= 55%)"
            exit 1
          }

      - name: Upload test report and coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.out

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
        shell: bash

      - name: Build with Wails
        env:
          CGO_ENABLED: 1
          npm_config_legacy_peer_deps: true
        run: wails build -webview2 embed
        shell: pwsh

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
        shell: bash

      - name: Build for release
        env:
          CGO_ENABLED: 1
          npm_config_legacy_peer_deps: true
        run: |
          wails build -webview2 embed
        shell: pwsh

      - name: Verify version.go matches tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v',''
          $goVersion = (Select-String -Path internal/migrate/version.go -Pattern 'const Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tagVersion -ne $goVersion) {
            Write-Host "::error::Tag $tagVersion does not match version.go Version $goVersion"
            exit 1
          }

      - name: Sign MoveKit.exe with Azure Trusted Signing
        if: env.AZURE_CLIENT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: build/bin/MoveKit.exe
          file-digest: SHA256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: build/bin/MoveKit.exe
          generate_release_notes: true
