# MoveKit Go lint configuration (golangci-lint v2.11.3)
version: "2"

run:
  timeout: 5m
  go: "1.25.0"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unconvert
    - unused
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
    gosec:
      excludes:
        - G104
    misspell:
      locale: US

  exclusions:
    paths:
      - ".*_test\\.go$"
      - "internal/syscall/.*"
      - "internal/folders/.*"
    rules:
      - path: ".*_test\\.go$"
        linters:
          - staticcheck
        text: "SA1019"
      - path: ".*_test\\.go$"
        linters:
          - unused
      - path: ".*_test\\.go$"
        linters:
          - gosec
        text: "G104"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/hyls9527/MoveKit

  exclusions:
    paths:
      - "internal/syscall/.*"
      - "internal/folders/.*"
